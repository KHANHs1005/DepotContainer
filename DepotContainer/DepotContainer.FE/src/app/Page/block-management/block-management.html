<div class="block-management-container">
  <!-- SIDEBAR -->
  <div class="dashboard-layout">
    <app-sidebar></app-sidebar>
    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="page-header">
        <h2>Quản lý block</h2>
        <button class="btn-add-block" (click)="openAddBlockModal()">
          + Thêm block
        </button>
      </header>
      <!-- GRID BLOCKS -->
      <div class="blocks-grid">
        <div class="block-card" *ngFor="let block of blocks">
          <div class="block-header">
            <h3>{{ block.blockName }}</h3>
            <button class="btn-delete" (click)="deleteBlock(block.blockId)">×</button>
          </div>

          <div class="block-stats">
            <div class="stat-item available">
              <span class="label">Sẵn</span>
              <span class="value">{{ block.availableSlots }}</span>
            </div>
            <div class="stat-item occupied">
              <span class="label">Đầy</span>
              <span class="value">{{ block.occupiedSlots }}</span>
            </div>
          </div>

          <button class="btn-manage" (click)="manageBlock(block.blockId)">
            Quản lý
          </button>
        </div>
      </div>
    </main>
  </div>
<!-- MODAL THÊM BLOCK -->
<div class="modal" *ngIf="showAddModal" (click)="closeAddBlockModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Thêm Block Mới</h2>
      <button class="btn-close" (click)="closeAddBlockModal()">×</button>
    </div>

    <form (ngSubmit)="addBlock()">
      <div class="form-group">
        <label>Tên Block</label>
        <input type="text"
               [(ngModel)]="newBlock.blockName"
               name="blockName"
               placeholder="Ví dụ: BLOCK A"
               required />
      </div>

      <div class="form-group">
        <label>Số slot</label>
        <input type="number"
               [(ngModel)]="newBlock.totalSlots"
               name="totalSlots"
               placeholder="Ví dụ: 50"
               required />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="closeAddBlockModal()">
          Hủy
        </button>
        <button type="submit" class="btn-submit">
          Thêm
        </button>
      </div>
    </form>
  </div>
</div>
</div>
